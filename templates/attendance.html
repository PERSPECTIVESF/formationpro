{% extends 'base.html' %}

{% block content %}
<div class="bg-white p-6 rounded-lg shadow-md max-w-lg mx-auto">
    <h1 class="text-3xl font-bold mb-4">Émargement pour {{ session.title }}</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="learner_id" class="block text-sm font-medium">Sélectionner l’apprenant</label>
            <select name="learner_id" class="w-full border rounded p-2" required>
                {% for learner in session.learners.all %}
                    <option value="{{ learner.id }}">{{ learner.first_name }} {{ learner.last_name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Marquer comme présent</button>
    </form>
</div>
{% endblock %}
